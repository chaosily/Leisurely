<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>경찰 초동조치 FTX 시뮬레이터</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1f2937;
      --primary: #1e3a8a;
      --primary-h: #172554;
      --status-bg: #e0f2fe;
      --status-text: #0369a1;
      --chat-bg: #fafafa;
      --border: #dddddd;
      --user-bg: #dbeafe;
      --user-text: #1e40af;
      --ai-bg: #f3f4f6;
      --input-bg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card: #1f2937;
        --text: #f9fafb;
        --primary: #3b82f6;
        --primary-h: #60a5fa;
        --status-bg: #1e3a8a;
        --status-text: #93c5fd;
        --chat-bg: #111827;
        --border: #4b5563;
        --user-bg: #1e3a8a;
        --user-text: #eff6ff;
        --ai-bg: #374151;
        --input-bg: #1f2937;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      transition: background 0.3s;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card);
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    }

    h2 {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
      padding-bottom: 10px;
      margin-bottom: 20px;
      font-size: 1.25rem;
    }

    /* ── 로그인 ── */
    .login-box { display: flex; flex-direction: column; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-weight: bold; font-size: 14px; }
    label span { font-weight: normal; font-size: 12px; opacity: 0.65; }

    select,
    input[type="text"],
    input[type="password"] {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 14px;
      width: 100%;
    }
    select:focus, input:focus { outline: 2px solid var(--primary); }

    button {
      padding: 12px 24px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-h); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── 시뮬레이터 ── */
    #simulator-zone { display: none; }

    .status-box {
      background: var(--status-bg);
      color: var(--status-text);
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-weight: bold;
      font-size: 14px;
    }

    /* ── 픽셀아트 뷰포트 ── */
    #pixel-art-zone {
      width: 100%;
      height: 220px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
      position: relative;
    }
    #pixel-img {
      width: auto;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      transition: opacity 0.5s ease;
    }
    #img-loader {
      position: absolute;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      display: none;
    }

    /* ── 채팅 ── */
    #chat-window {
      height: 320px;
      border: 1px solid var(--border);
      padding: 15px;
      overflow-y: auto;
      background: var(--chat-bg);
      border-radius: 6px;
      margin-bottom: 15px;
      scroll-behavior: smooth;
    }
    .message {
      margin-bottom: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 82%;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user { background: var(--user-bg); color: var(--user-text); margin-left: auto; text-align: right; }
    .ai   { background: var(--ai-bg); margin-right: auto; }

    .input-group { display: flex; gap: 10px; }
    .input-group input { flex: 1; }
  </style>
</head>
<body>

<div class="container">

  <!-- ── 로그인 존 ── -->
  <div id="login-zone">
    <h2>경찰 초동조치 시뮬레이터 — 로그인</h2>
    <div class="login-box">

      <div class="form-group">
        <label>성명</label>
        <input type="text" id="user-name" placeholder="홍길동" />
      </div>

      <div class="form-group">
        <label>계급</label>
        <select id="user-rank">
          <option value="순경">순경</option>
          <option value="경장">경장</option>
          <option value="경사">경사</option>
          <option value="경위">경위</option>
        </select>
      </div>

      <div class="form-group">
        <label>소속 부서 <span>(부서에 따라 상황과 평가 기준이 변경됩니다)</span></label>
        <select id="user-dept">
          <option value="지구대 파출소">지구대·파출소 (현장 보존 및 긴급 제지 중심)</option>
          <option value="형사과">형사과 (강력범죄 제압 및 피의자 신문 중심)</option>
          <option value="112 타격대">112 타격대 (대테러 및 작전 통제 중심)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Groq API 키 <span>(훈련 세션에만 사용되며 저장되지 않습니다)</span></label>
        <input type="password" id="groq-key" placeholder="gsk_..." />
      </div>

      <button id="login-btn">FTX 훈련 입장</button>
    </div>
  </div>

  <!-- ── 시뮬레이터 존 ── -->
  <div id="simulator-zone">
    <h2>FTX 시뮬레이터</h2>

    <div class="status-box">
      훈련관: <span id="player-info"></span>&nbsp;|&nbsp;
      현재 상태: <span id="current-stage">1단계: 출동 및 상황 파악</span>&nbsp;|&nbsp;
      점수: <span id="current-score">100</span>점
    </div>

    <!-- 실시간 도트 그래픽 뷰포트 -->
    <div id="pixel-art-zone">
      <span id="img-loader">CCTV 및 현장 그래픽 동기화 중...</span>
      <img id="pixel-img" src="" alt="FTX 현장 그래픽" />
    </div>

    <div id="chat-window">
      <div id="initial-ai-msg" class="message ai"></div>
    </div>

    <div class="input-group">
      <input type="text" id="user-input" placeholder="경찰관으로서 취할 조치를 입력하세요..." />
      <button id="send-btn">명령 하달</button>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";

  /* ── 인프라 설정 ── */
  const SUPABASE_URL  = "YOUR_SUPABASE_URL";
  const SUPABASE_KEY  = "YOUR_SUPABASE_KEY";
  const GROQ_ENDPOINT = "https://api.groq.com/openai/v1/chat/completions";
  const GROQ_MODEL    = "llama-3.1-8b-instant";
  const POLLINATIONS  = "https://image.pollinations.ai/p/";

  /* ── 세션 상태 ── */
  let groqApiKey  = "";
  let player      = { name: "", rank: "", dept: "" };
  let score       = 100;
  let turnCount   = 0;
  let chatHistory = [];

  /* ── 부서별 초기 상황 & 픽셀아트 프롬프트 ── */
  const DEPT_CONFIG = {
    "지구대 파출소": {
      situation: (rank) =>
        `[상황 발생] 주택가 골목길에서 흉기를 든 주취자가 난동을 부리며 주민들을 위협 중이라는 112 신고를 받고 순찰차가 현장에 선착했습니다. 피의자가 칼을 휘두르고 있습니다. ${rank} 님, 현장 초동조치는 무엇입니까?`,
      artPrompt: "korean police car arriving at messy street alley, drunk man holding a knife, 16-bit retro pixel art, side view game style",
    },
    "형사과": {
      situation: (rank) =>
        `[상황 발생] 강력 사건 피의자가 흉기를 지닌 채 도주하여 인근 모텔방에 은신 중이라는 첩보를 입수하고 문 앞을 포위했습니다. 내부에서 비명소리가 들립니다. 형사과 ${rank} 님, 즉각적인 진입 및 제압 조치는 무엇입니까?`,
      artPrompt: "dark motel hallway, police officers stacking up at a door, tactical entry, 16-bit retro pixel art, cinematic gaming lighting",
    },
    "112 타격대": {
      situation: (rank) =>
        `[상황 발생] 국가 중요 시설 인근에서 미상 요주의 인물이 군사용 개조 드론을 띄워 접근시키는 대공 취약 상황이 포착되었습니다. 타격대장 ${rank} 님, 대테러 및 인프라 방호를 위한 초동조치는 무엇입니까?`,
      artPrompt: "military drone flying near national power plant facility, tactical police unit looking up with anti-drone weapon, 16-bit pixel art",
    },
  };

  /* ── DOM 참조 ── */
  const loginZone     = document.getElementById("login-zone");
  const simZone       = document.getElementById("simulator-zone");
  const loginBtn      = document.getElementById("login-btn");
  const sendBtn       = document.getElementById("send-btn");
  const userInputEl   = document.getElementById("user-input");
  const chatWindow    = document.getElementById("chat-window");
  const scoreEl       = document.getElementById("current-score");
  const stageEl       = document.getElementById("current-stage");
  const playerInfoEl  = document.getElementById("player-info");
  const pixelImg      = document.getElementById("pixel-img");
  const imgLoader     = document.getElementById("img-loader");
  const initialMsgEl  = document.getElementById("initial-ai-msg");

  /* ── 이벤트 바인딩 ── */
  loginBtn.addEventListener("click", handleLogin);
  sendBtn.addEventListener("click", sendMessage);
  userInputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") sendMessage();
  });

  /* ── 로그인 처리 ── */
  function handleLogin() {
    const name = document.getElementById("user-name").value.trim();
    const rank = document.getElementById("user-rank").value;
    const dept = document.getElementById("user-dept").value;
    const key  = document.getElementById("groq-key").value.trim();

    if (!name) { alert("훈련관의 성명을 입력해 주세요."); return; }
    if (!key)  { alert("Groq API 키를 입력해 주세요."); return; }

    groqApiKey = key;
    player = { name, rank, dept };

    loginZone.style.display  = "none";
    simZone.style.display    = "block";
    playerInfoEl.textContent = `${dept} ${name} ${rank}`;

    const config      = DEPT_CONFIG[dept] || DEPT_CONFIG["지구대 파출소"];
    const startMsg    = config.situation(rank);

    initialMsgEl.textContent = startMsg;
    chatHistory.push({ role: "assistant", content: startMsg });

    generatePixelArt(config.artPrompt);
  }

  /* ── Groq 멀티턴 호출 ── */
  async function sendMessage() {
    const text = userInputEl.value.trim();
    if (!text) return;

    appendMessage(text, "user");
    chatHistory.push({ role: "user", content: text });
    userInputEl.value = "";
    sendBtn.disabled  = true;

    const loadingDiv = appendMessage("교관이 소속 지침 및 직무집행법을 근거로 분석 중입니다...", "ai");

    try {
      const systemPrompt =
        `너는 대한민국 경찰학교의 베테랑 FTX 주관 교관이다. ` +
        `피훈련자 — 소속: [${player.dept}], 계급: [${player.rank}], 성명: [${player.name}]. ` +
        `피훈련자의 조치가 소속 부서 임무 매뉴얼 및 '경찰관 직무집행법'에 적합한지 엄격히 심사하고, ` +
        `소속 부서에 특화된 피드백과 다음 상황을 이어서 전개하라. ` +
        `답변은 한국어로 3줄 이내로 명확하게 작성하라.`;

      const res = await fetch(GROQ_ENDPOINT, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${groqApiKey}`,
          "Content-Type":  "application/json",
        },
        body: JSON.stringify({
          model: GROQ_MODEL,
          messages: [
            { role: "system", content: systemPrompt },
            ...chatHistory,
          ],
        }),
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData?.error?.message || `HTTP ${res.status}`);
      }

      const data    = await res.json();
      const aiReply = data.choices[0].message.content;

      chatHistory.push({ role: "assistant", content: aiReply });

      loadingDiv.remove();
      appendMessage(aiReply, "ai");

      turnCount++;
      score = Math.max(0, score - 5);
      scoreEl.textContent = score;
      stageEl.textContent = `${turnCount + 1}단계`;

      // 유저 조치 텍스트를 직접 아트 프롬프트에 반영
      const artPrompt = `south korean tactical police operation: ${text}, game sprite style, 16-bit retro pixel art, dramatic lighting`;
      generatePixelArt(artPrompt);

      saveToSupabase(`${player.dept}_${player.name}`, score);

    } catch (err) {
      console.error("[Groq 오류]", err);
      loadingDiv.textContent = `통신 에러: ${err.message}`;
    } finally {
      sendBtn.disabled = false;
      userInputEl.focus();
    }
  }

  /* ── Pollinations AI 픽셀아트 렌더러 ── */
  function generatePixelArt(prompt) {
    const seed       = Math.floor(Math.random() * 99999);
    const imageUrl   = `${POLLINATIONS}${encodeURIComponent(prompt)}?width=800&height=250&nologo=true&seed=${seed}`;

    imgLoader.style.display  = "block";
    pixelImg.style.opacity   = "0.3";

    const tempImg  = new Image();
    tempImg.onload = function () {
      pixelImg.src           = imageUrl;
      pixelImg.style.opacity = "1";
      imgLoader.style.display = "none";
    };
    tempImg.onerror = function () {
      imgLoader.style.display = "none";
      pixelImg.style.opacity  = "1";
    };
    tempImg.src = imageUrl;
  }

  /* ── Supabase 저장 ── */
  async function saveToSupabase(stageInfo, currentScore) {
    if (SUPABASE_URL === "YOUR_SUPABASE_URL") return;
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/user_status`, {
        method: "POST",
        headers: {
          "apikey":        SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type":  "application/json",
          "Prefer":        "return=representation",
        },
        body: JSON.stringify({ stage: stageInfo, score: currentScore }),
      });
    } catch (e) {
      console.warn("[Supabase 저장 실패]", e.message);
    }
  }

  /* ── 채팅 메시지 DOM 추가 ── */
  function appendMessage(text, classes) {
    const div = document.createElement("div");
    div.className   = `message ${classes}`;
    div.textContent = text;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return div;
  }

})();
</script>

</body>
</html>
